<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aces In Da Hole — Launch Incoming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Bebas Neue', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
            body: ['DM Sans', 'sans-serif'],
          },
          colors: {
            blush: '#f0ddd6',
            'blush-dark': '#e8cfc5',
            'blush-mid': '#dbb8ac',
            accent: '#d94f3d',
            'accent-dark': '#c03e2d',
            ink: '#1a1412',
            muted: '#7a6358',
          },
          animation: {
            'float-slow': 'floatSlow 7s ease-in-out infinite',
            'float-med': 'floatMed 5.5s ease-in-out infinite',
            'float-fast': 'floatFast 4.5s ease-in-out infinite',
            'fade-up': 'fadeUp 0.9s ease both',
            'fade-in': 'fadeIn 1.2s ease both',
            'pulse-dot': 'pulseDot 2s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
            'spin-slow': 'spin 12s linear infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px) rotate(var(--r))' },
              '50%': { transform: 'translateY(-18px) rotate(var(--r))' },
            },
            floatMed: {
              '0%, 100%': { transform: 'translateY(0px) rotate(var(--r))' },
              '50%': { transform: 'translateY(-12px) rotate(var(--r))' },
            },
            floatFast: {
              '0%, 100%': { transform: 'translateY(0px) rotate(var(--r))' },
              '50%': { transform: 'translateY(-8px) rotate(var(--r))' },
            },
            fadeUp: {
              from: { opacity: 0, transform: 'translateY(28px)' },
              to: { opacity: 1, transform: 'translateY(0)' },
            },
            fadeIn: {
              from: { opacity: 0 },
              to: { opacity: 1 },
            },
            pulseDot: {
              '0%, 100%': { opacity: 1, transform: 'scale(1)' },
              '50%': { opacity: 0.4, transform: 'scale(0.7)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
          },
          boxShadow: {
            'card': '0 8px 40px rgba(26,20,18,0.18), 0 2px 8px rgba(26,20,18,0.10)',
            'card-hover': '0 16px 60px rgba(26,20,18,0.25), 0 4px 16px rgba(26,20,18,0.15)',
            'input': '0 2px 16px rgba(26,20,18,0.08)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: #f0ddd6;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      opacity: 0.35;
    }

    /* Radial glow background */
    .bg-glow {
      background: radial-gradient(ellipse 75% 60% at 50% 20%, #f8ebe5 0%, #f0ddd6 40%, #e4c5b8 100%);
    }

    /* Polaroid card styles */
    .polaroid {
      background: white;
      padding: 10px 10px 28px 10px;
      position: absolute;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: default;
    }
    .polaroid:hover {
      box-shadow: 0 20px 60px rgba(26,20,18,0.28);
      z-index: 50;
    }
    .polaroid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .polaroid-tag {
      background: white;
      position: absolute;
      padding: 6px 8px;
      box-shadow: 0 4px 16px rgba(26,20,18,0.15);
    }
    .polaroid-tag .logo-circle {
      width: 28px;
      height: 28px;
      border: 1.5px solid #1a1412;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 3px;
    }

    /* Input shimmer on focus */
    .email-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #d94f3d44, 0 2px 16px rgba(26,20,18,0.10);
    }

    /* Button hover effect */
    .join-btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .join-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }
    .join-btn:hover {
      background-color: #c03e2d;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(217,79,61,0.45);
    }
    .join-btn:active {
      transform: translateY(0px);
    }

    /* Logo SVG */
    .logo-mark {
      width: 56px;
      height: 56px;
    }

    /* Avatar stack */
    .avatar-ring {
      border: 2.5px solid white;
      box-shadow: 0 2px 8px rgba(26,20,18,0.15);
    }

     

    /* Floating cards with individual rotations */
    .card-1  { --r: -14deg; }
    .card-2  { --r: 8deg; }
    .card-3  { --r: -6deg; }
    .card-4  { --r: 12deg; }
    .card-5  { --r: -10deg; }
    .card-6  { --r: 5deg; }
    .card-7  { --r: -16deg; }
    .card-8  { --r: 9deg; }
    .card-9  { --r: -4deg; }
    .card-10 { --r: 14deg; }
  </style>
</head>

<body class="min-h-screen bg-glow relative">

  <!-- ── HERO ─────────────────────────────────────────────────── -->
  <main class="relative min-h-screen flex flex-col items-center pt-10 pb-0 overflow-hidden" style="background-image: url('background2.png'); padding-top: 50px; padding-bottom: 50px; background-position: center bottom; background-repeat: no-repeat; background-size: contain; background-attachment: fixed;">

    <!-- Logo -->
    <div class="relative z-10" style="animation-delay:0s">
       <img src="logonew.png" alt="Logo"> 
    </div>

    <!-- Badge -->
    <div class="mt-8  delay-100 relative z-10">
      <span class="inline-flex items-center gap-2 bg-white/70 backdrop-blur-sm border border-ink/10 rounded-full px-4 py-1.5 text-sm font-body text-ink/80 shadow-sm">
        <span class="w-2 h-2 rounded-full bg-accent "></span>
        Launch Incoming
      </span>
    </div>

    <!-- Headline -->
    <h1 class=" delay-200 relative z-10 mt-7 text-center font-inter font-medium leading-[1.05] text-ink px-6" style="font-size: clamp(2.6rem, 6vw, 4.8rem); max-width: 880px;">
      Sign Up To Our Email List To Get
      Notified When We Launch
    </h1>

    <!-- Subheadline -->
    <p class=" delay-300 relative z-10 mt-5 text-center font-body text-muted text-base leading-relaxed px-6" style="max-width: 520px;">
      An exclusive collection crafted for the bold. Experience the fusion of modern aesthetics and timeless elegance.
    </p>

    <!-- Email Form -->
    <div class=" delay-500 relative z-10 mt-8 w-full px-6 flex justify-center">
      <div class="flex items-center w-full shadow-card rounded-xl overflow-hidden" style="max-width: 560px;">
        <input
          type="email"
          placeholder="Your Email"
          class="email-input flex-1 bg-white px-6 py-4 text-base font-body text-ink placeholder-ink/30 border-0 transition-all duration-200"
          style="min-width: 0;"
        />
        <button class="join-btn bg-accent text-white font-body font-medium text-base px-8 py-4 whitespace-nowrap tracking-wide">
          Join
        </button>
      </div>
    </div>

    <!-- Social Proof -->
    <div class="flex flex-col items-center justify-center gap-2 delay-5 p-4">
  
  <div class="flex -space-x-3">
    <div class="w-10 h-10 rounded-full border-2 border-gray-900 bg-gray-900 flex items-center justify-center text-lg overflow-hidden">
      <img src="Face 1.png" alt="Face 1" class="w-full h-full object-cover">
    </div>
    <div class="w-10 h-10 rounded-full border-2 border-gray-900 bg-gray-900 flex items-center justify-center text-lg overflow-hidden">
      <img src="Face 2.png" alt="Face 2" class="w-full h-full object-cover">
    </div>
    <div class="w-10 h-10 rounded-full border-2 border-gray-900 bg-gray-900 flex items-center justify-center text-lg overflow-hidden">
      <img src="Face 3.png" alt="Face 3" class="w-full h-full object-cover">
    </div>
  </div>

  <p class="text-gray-600 text-sm font-medium ">
    <span class="font-bold text-gray-900">Join 39k other creatives</span>  
  </p>
</div>
 
     

  </main>
  

  
</body>
</html>
